<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEETS WIZARD OS</title>
    <style>
        :root {
            --bg-dark: #020c02;
            --sidebar-bg: rgba(16, 30, 16, 0.7);
            --accent-green: #107C41;
            --accent-light: #21a356;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(16, 124, 65, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 124, 65, 0.06) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Inter', sans-serif; color: var(--text-main);
            overflow: hidden;
        }

        .os-container { display: flex; height: 100vh; }

        .sidebar {
            width: 240px; flex-shrink: 0;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(16, 124, 65, 0.3);
            padding: 20px; display: flex; flex-direction: column;
            backdrop-filter: blur(12px);
            overflow-y: auto;
        }

        .logo { font-weight: 800; margin-bottom: 30px; font-size: 1.1rem; text-transform: uppercase; }
        .logo span { color: var(--accent-light); }

        .nav-btn {
            display: block; width: 100%; padding: 10px;
            background: transparent; border: none;
            color: var(--text-dim); text-align: left;
            cursor: pointer; border-radius: 6px; margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .nav-btn:hover { background: rgba(16, 124, 65, 0.15); color: white; }

        .home-btn {
            background: var(--accent-green) !important;
            color: white !important;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .viewport { flex-grow: 1; background: rgba(0, 0, 0, 0.2); position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        .notes-panel {
            width: 320px; flex-shrink: 0;
            background: rgba(5, 15, 5, 0.9);
            border-left: 1px solid rgba(16, 124, 65, 0.3);
            padding: 20px; display: flex; flex-direction: column;
            transition: width 0.3s ease, padding 0.3s ease, border-left 0.3s ease;
        }

        .notes-panel.collapsed {
            width: 0; padding: 0; border-left: none; overflow: hidden;
        }

        #note-area {
            flex-grow: 1; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(16, 124, 65, 0.4); border-radius: 8px;
            color: white; padding: 15px; resize: none; margin-top: 10px;
            font-family: inherit;
        }

        #csv-container {
            flex-grow: 1; overflow: auto; margin-top: 10px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(16, 124, 65, 0.4); border-radius: 8px;
        }

        #csv-table { width: 100%; border-collapse: collapse; color: white; font-size: 0.8rem; }
        #csv-table td { border: 1px solid rgba(16, 124, 65, 0.3); padding: 8px; outline: none; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }

        .action-btn {
            padding: 12px; border: none; border-radius: 6px;
            color: white; font-weight: bold; cursor: pointer;
            font-size: 0.8rem;
        }

        .export-btn { background: #107C41; }
        .import-btn { background: #1a6b3a; }
        .reset-btn { background: #ef4444; }

        .section-label {
            font-size: 0.7rem; color: var(--accent-light);
            margin: 15px 0 10px 5px; font-weight: bold; letter-spacing: 1px;
        }

        .section-label.collapsible {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 5px;
            border-radius: 4px;
            user-select: none;
        }

        .section-label.collapsible:hover {
            background: rgba(16, 124, 65, 0.1);
        }

        .section-label.collapsible::after {
            content: '▶';
            font-size: 0.6rem;
            transition: transform 0.2s ease;
        }

        .section-label.collapsible.expanded::after {
            content: '▼';
        }

        .section-items {
            display: none;
        }

        .section-items.expanded {
            display: block;
        }
    </style>
</head>
<body>

    <div class="os-container">
        <aside class="sidebar">
            <div class="logo">SHEETS <span>WIZARD</span> OS</div>
            <button class="nav-btn home-btn" onclick="loadApp('dashboard.html')">🏠 HOME DASHBOARD</button>
            <nav id="menu">
                <div class="section-label">CONTROLS</div>
                <button class="nav-btn" style="border: 1px solid var(--accent-green);" onclick="toggleNotes()">↔️ Toggle Notes Panel</button>
                <div class="section-label collapsible" id="tools-header">TUTORIALS</div>
                <div class="section-label collapsible" id="formulas-header">FORMULAS</div>
                <div class="section-label collapsible" id="functions-header">FUNCTIONS</div>
            </nav>
        </aside>

        <main class="viewport">
            <iframe id="stage" src="dashboard.html"></iframe>
        </main>

        <aside class="notes-panel" id="notes-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; min-width: 280px;">
                <h3 style="margin: 0; font-size: 0.8rem;">DATA & NOTES</h3>
                <select id="view-type" onchange="toggleView()" style="background: #0d2b17; color: white; border: 1px solid rgba(16,124,65,0.4); border-radius: 4px; font-size: 0.7rem; padding: 4px;">
                    <option value="txt">TXT Mode</option>
                    <option value="csv">CSV Mode</option>
                </select>
            </div>
            <textarea id="note-area" placeholder="Jot down notes..."></textarea>
            <div id="csv-container" style="display:none;"><table id="csv-table"></table></div>
            <div class="btn-group">
                <button class="action-btn export-btn" onclick="exportData()">💾 EXPORT</button>
                <button class="action-btn import-btn" onclick="triggerImport()">📂 IMPORT</button>
                <button class="action-btn reset-btn" onclick="resetNotes()">🗑️ RESET</button>
            </div>
            <input type="file" id="file-selector" style="display:none" accept=".txt,.csv">
        </aside>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const GITHUB_CONFIG = {
            username: 'Latecreator',
            repo: 'sheetswizardos',
            folder: 'tools'
        };

        // --- 2. DYNAMIC MENU SYNC ---
        const MENU_SECTIONS = [
            { id: 'tools-header', folder: 'tools', pathPrefix: './tools/' },
            { id: 'formulas-header', folder: 'tools/formulas', pathPrefix: './tools/formulas/' },
            { id: 'functions-header', folder: 'tools/functions', pathPrefix: './tools/functions/' }
        ];

        async function autoUpdateMenu() {
            // Create section-items containers and attach toggle handlers
            MENU_SECTIONS.forEach(section => {
                const header = document.getElementById(section.id);
                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'section-items';
                itemsDiv.id = section.id + '-items';
                header.after(itemsDiv);

                header.addEventListener('click', () => {
                    header.classList.toggle('expanded');
                    itemsDiv.classList.toggle('expanded');
                });
            });

            // Fetch each folder in parallel
            const fetches = MENU_SECTIONS.map(async (section) => {
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${section.folder}`);
                    const files = await response.json();
                    const itemsDiv = document.getElementById(section.id + '-items');

                    if (Array.isArray(files)) {
                        const htmlFiles = files.filter(f => f.name.endsWith('.html')).sort((a, b) => a.name.localeCompare(b.name));
                        htmlFiles.forEach(file => {
                            const btn = document.createElement('button');
                            btn.className = 'nav-btn';
                            const displayName = file.name.replace('.html', '').replace(/-/g, ' ');
                            btn.innerHTML = `📊 ${displayName}`;
                            btn.onclick = () => loadApp(`${section.pathPrefix}${file.name}`);
                            itemsDiv.appendChild(btn);
                        });
                    }
                } catch (err) {
                    console.error(`Menu sync error for ${section.folder}:`, err);
                }
            });

            await Promise.all(fetches);
        }

        function loadApp(url) { document.getElementById('stage').src = url; }
        autoUpdateMenu();

        // --- 3. UI CONTROLS ---
        function toggleNotes() { document.getElementById('notes-panel').classList.toggle('collapsed'); }
        function toggleView() {
            const view = document.getElementById('view-type').value;
            const txtArea = document.getElementById('note-area');
            const csvCont = document.getElementById('csv-container');
            txtArea.style.display = view === 'csv' ? 'none' : 'block';
            csvCont.style.display = view === 'csv' ? 'block' : 'none';
            if (view === 'csv') renderCSV(txtArea.value);
        }

        function renderCSV(rawText) {
            const table = document.getElementById('csv-table');
            table.innerHTML = "";
            if (!rawText.trim()) return;
            rawText.split("\n").forEach(row => {
                const tr = document.createElement('tr');
                row.split(",").forEach(col => {
                    const td = document.createElement('td');
                    td.contentEditable = "true";
                    td.innerText = col.trim();
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
        }

        // --- 4. DATA HANDLING ---
        function triggerImport() { document.getElementById('file-selector').click(); }
        document.getElementById('file-selector').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('note-area').value = e.target.result;
                if (document.getElementById('view-type').value === 'csv') renderCSV(e.target.result);
            };
            reader.readAsText(file);
        });

        function exportData() {
            const view = document.getElementById('view-type').value;
            let content = view === 'csv' ?
                Array.from(document.querySelectorAll('#csv-table tr')).map(r => Array.from(r.querySelectorAll('td')).map(t => t.innerText).join(",")).join("\n") :
                document.getElementById('note-area').value;
            const blob = new Blob([content], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = `sheetswizard-data.${view === 'csv' ? 'csv' : 'txt'}`;
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
        }

        function resetNotes() {
            if (confirm("Clear all data?")) {
                document.getElementById('note-area').value = "";
                document.getElementById('csv-table').innerHTML = "";
                localStorage.removeItem('sw_notes');
            }
        }

        // --- 5. PERSISTENCE ---
        const noteArea = document.getElementById('note-area');
        noteArea.value = localStorage.getItem('sw_notes') || "";
        noteArea.addEventListener('input', () => localStorage.setItem('sw_notes', noteArea.value));
    </script>
</body>
</html>
