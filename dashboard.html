<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: transparent;
            color: white;
            font-family: sans-serif;
            padding: 40px;
        }
        .stats-grid { display: grid; grid-template-columns: 1fr; max-width: 400px; margin-top: 20px; }
        .stat-card {
            background: rgba(16, 124, 65, 0.08);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(16, 124, 65, 0.3);
        }
        h1 { color: #21a356; }
        .stat-number { font-size: 2rem; margin: 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>SHEETS WIZARD OS v1.0</h1>
    <p>System Online. Welcome back, Wizard.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Active Tutorials</h3>
            <p id="tool-count" class="stat-number">...</p>
        </div>
    </div>

    <script>
        const GITHUB_CONFIG = {
            username: 'Latecreator',
            repo: 'sheetswizardos',
            folder: 'tools'
        };

        async function updateDashboardStats() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.folder}`);
                const files = await response.json();

                if (Array.isArray(files)) {
                    const activeTools = files.filter(file => file.name.endsWith('.html')).length;
                    document.getElementById('tool-count').innerText = activeTools;
                }
            } catch (err) {
                console.error("Dashboard sync error:", err);
                document.getElementById('tool-count').innerText = "!";
            }
        }
        updateDashboardStats();
    </script>
</body>
</html>
