<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: transparent;
            color: white;
            font-family: sans-serif;
            padding: 40px;
        }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; max-width: 700px; margin-top: 20px; gap: 15px; }
        .stat-card {
            background: rgba(16, 124, 65, 0.08);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(16, 124, 65, 0.3);
        }
        h1 { color: #21a356; }
        .stat-number { font-size: 2rem; margin: 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>SHEETS WIZARD OS v1.0</h1>
    <p>System Online. Welcome back, Wizard.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Active Tutorials</h3>
            <p id="tool-count" class="stat-number">...</p>
        </div>
        <div class="stat-card">
            <h3>Formula Explainers</h3>
            <p id="formula-count" class="stat-number">...</p>
        </div>
        <div class="stat-card">
            <h3>Total Files</h3>
            <p id="total-count" class="stat-number">...</p>
        </div>
    </div>

    <script>
        const GITHUB_CONFIG = {
            username: 'Latecreator',
            repo: 'sheetswizardos',
            folder: 'tools'
        };

        async function countHtmlFiles(folder) {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${folder}`);
            const files = await response.json();
            return Array.isArray(files) ? files.filter(f => f.name.endsWith('.html')).length : 0;
        }

        async function updateDashboardStats() {
            try {
                const [tutorials, formulas] = await Promise.all([
                    countHtmlFiles('tools'),
                    countHtmlFiles('tools/formulas')
                ]);
                document.getElementById('tool-count').innerText = tutorials;
                document.getElementById('formula-count').innerText = formulas;
                document.getElementById('total-count').innerText = tutorials + formulas;
            } catch (err) {
                console.error("Dashboard sync error:", err);
                document.getElementById('tool-count').innerText = "!";
                document.getElementById('formula-count').innerText = "!";
                document.getElementById('total-count').innerText = "!";
            }
        }
        updateDashboardStats();
    </script>
</body>
</html>
